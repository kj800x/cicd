apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: deployconfigs.cicd.coolkev.com
spec:
  group: cicd.coolkev.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                config:
                  type: object
                  required:
                    - owner
                    - repo
                  properties:
                    owner:
                      type: string
                    repo:
                      type: string
                parameters:
                  type: object
                  description: "Named parameter sources. Each parameter's value is substituted for $NAME in specs."
                  additionalProperties:
                    type: object
                    required:
                      - type
                    properties:
                      type:
                        type: string
                        enum:
                          - commit
                          - value
                      owner:
                        type: string
                      repo:
                        type: string
                      branch:
                        type: string
                      default:
                        type: string
                    x-kubernetes-validations:
                      - rule: "self.type != 'commit' || (has(self.owner) && has(self.repo) && has(self.branch))"
                        message: "commit sources require owner, repo and branch"
                      - rule: "self.type != 'value' || has(self.default)"
                        message: "value sources require a default"
                selections:
                  type: object
                  description: "Per-parameter intent: track an override branch or pin a value, with a durability. Absent means track the default channel. Written by the deploy handler."
                  additionalProperties:
                    type: object
                    properties:
                      track:
                        type: object
                        required:
                          - branch
                        properties:
                          branch:
                            type: string
                      pin:
                        type: object
                        required:
                          - value
                        properties:
                          value:
                            type: string
                      durability:
                        type: string
                        enum:
                          - temporary
                          - standing
                      note:
                        type: string
                      by:
                        type: string
                      since:
                        type: string
                    x-kubernetes-validations:
                      - rule: "!(has(self.track) && has(self.pin))"
                        message: "a selection is either track or pin, not both"
                patches:
                  type: array
                  description: "JSON Patch operations applied to the rendered manifests, in order. Written by the deploy handler."
                  items:
                    type: object
                    required:
                      - target
                      - op
                      - path
                    properties:
                      target:
                        type: object
                        required:
                          - kind
                          - name
                        properties:
                          file:
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
                      op:
                        type: string
                        enum:
                          - add
                          - replace
                          - remove
                      path:
                        type: string
                      value:
                        x-kubernetes-preserve-unknown-fields: true
                      durability:
                        type: string
                        enum:
                          - temporary
                          - standing
                      note:
                        type: string
                      by:
                        type: string
                      since:
                        type: string
                team:
                  type: string
                kind:
                  type: string
                  description: "The kind of deployable (service, worker, job, meta, etc.)"
                specs:
                  type: array
                  description: "Array of Kubernetes resource manifests"
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              required:
                - config
                - team
                - kind
            status:
              type: object
              properties:
                orphaned:
                  type: boolean
                autodeploy:
                  type: boolean
                parameters:
                  type: object
                  description: "Deployed value per named parameter."
                  additionalProperties:
                    type: object
                    required:
                      - type
                    properties:
                      type:
                        type: string
                        enum:
                          - commit
                          - value
                      value:
                        type: string
                      branch:
                        type: string
                config:
                  type: object
                  properties:
                    sha:
                      type: string
                    branch:
                      type: string

      additionalPrinterColumns:
        - name: Team
          jsonPath: .spec.team
          type: string
        - name: Kind
          jsonPath: .spec.kind
          type: string
        - name: Artifact Repo
          jsonPath: .spec.parameters.SHA.repo
          type: string
        - name: Config Repo
          jsonPath: .spec.config.repo
          type: string
        - name: Config SHA
          jsonPath: .status.config.sha
          type: string
        - name: Artifact SHA
          jsonPath: .status.parameters.SHA.value
          type: string
        - name: Autodeploy
          jsonPath: .status.autodeploy
          type: boolean
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
        - name: Orphaned
          jsonPath: .status.orphaned
          type: boolean
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: deployconfigs
    singular: deployconfig
    kind: DeployConfig
    shortNames:
      - dc
